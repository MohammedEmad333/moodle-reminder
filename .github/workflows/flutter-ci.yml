name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Apply analyzer compatibility fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path('lib/screens/home_shell.dart')
          text = home.read_text()
          text = text.replace('scheme.onPrimary.withOpacity(.8)', 'scheme.onPrimary.withValues(alpha: .8)')
          home.write_text(text)

          notifications = Path('lib/services/notification_service.dart')
          text = notifications.read_text()
          old = """      if (deadline.isPast || completedIds.contains(deadline.stableKey))\n        continue;"""
          new = """      if (deadline.isPast || completedIds.contains(deadline.stableKey)) {\n        continue;\n      }"""
          if old not in text:
              print('Notification guard is already fixed or changed.')
          else:
              text = text.replace(old, new)
              notifications.write_text(text)
          PY

      - name: Apply Dart formatting
        run: dart format lib test

      - name: Commit source cleanup if needed
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- lib test; then
            echo "Source cleanup already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "fix: satisfy current Flutter analyzer"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moodle-reminder-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
