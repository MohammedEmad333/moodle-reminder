<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Moodle Reminder</title>
  <desc id="desc">Moodle Reminder brand banner with calendar and reminder icon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F1B18"/>
      <stop offset="1" stop-color="#3A2A1F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A3D"/>
      <stop offset="1" stop-color="#F98012"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="36" fill="url(#bg)"/>
  <circle cx="1110" cy="100" r="250" fill="#F98012" opacity="0.08"/>
  <circle cx="1160" cy="590" r="330" fill="#F98012" opacity="0.06"/>
  <circle cx="80" cy="570" r="260" fill="#FFFFFF" opacity="0.025"/>

  <g transform="translate(105 125)" filter="url(#shadow)">
    <rect width="390" height="390" rx="92" fill="url(#accent)"/>
    <rect x="78" y="92" width="220" height="206" rx="30" fill="#FFFFFF"/>
    <rect x="112" y="62" width="26" height="64" rx="13" fill="#FFFFFF"/>
    <rect x="238" y="62" width="26" height="64" rx="13" fill="#FFFFFF"/>
    <rect x="112" y="158" width="150" height="17" rx="8.5" fill="#F98012"/>
    <rect x="112" y="205" width="112" height="17" rx="8.5" fill="#F98012"/>
    <circle cx="286" cy="267" r="72" fill="#4A3F37"/>
    <path d="M286 230c-18 0-31 14-31 33v18h62v-18c0-19-13-33-31-33Zm-39 55h78v14h-78v-14Zm31 21h16c0 12-3 18-8 18s-8-6-8-18Z" fill="#FFFFFF"/>
  </g>

  <g transform="translate(565 180)">
    <text x="0" y="0" fill="#F98012" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="5">FLUTTER • ANDROID</text>
    <text x="0" y="86" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="800">Moodle Reminder</text>
    <text x="0" y="145" fill="#E8DED8" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="400">Never miss a Moodle deadline again.</text>
    <text x="0" y="198" fill="#BEB2AA" font-family="Inter, Arial, sans-serif" font-size="22">Private calendar sync • Offline cache • Local reminders</text>
    <text x="0" y="235" fill="#BEB2AA" font-family="Inter, Arial, sans-serif" font-size="22">Arabic + English • Light + Dark • Privacy-friendly</text>

    <g transform="translate(0 285)">
      <rect width="190" height="58" rx="29" fill="#F98012"/>
      <text x="95" y="37" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Open Source</text>
      <rect x="208" width="230" height="58" rx="29" fill="#FFFFFF" opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="323" y="37" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Privacy First</text>
    </g>
  </g>
</svg>
